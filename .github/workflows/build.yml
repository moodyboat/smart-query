name: build

# 触发：push 到任意分支 + 任意 PR
# 只在代码改动时跑（仅改 docs/CLAUDE.md 不会触发）
# 'on' 加引号：避免被 YAML 1.1 解析为 bool（GitHub Actions 已知坑）
'on':
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ===== 后端：Java 17 + Maven =====
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Maven
        uses: actions/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Cache Maven 仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Backend 编译
        working-directory: backend
        run: mvn -B -DskipTests -q compile

      # ===== 前端：Node 20 + Vite build =====
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Frontend 构建
        working-directory: frontend
        run: npm run build
