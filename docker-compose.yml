# smart-query 本地/测试部署编排
# 用法：
#   docker compose --profile tools build python     # 先构建 python 执行镜像（后端 docker run 调用）
#   docker compose build                            # 构建后端 + 前端
#   docker compose up                               # 启动（前端 http://localhost:5173  后端 :9000）
# 配置：复制 .env.example → .env 覆盖 DEEPSEEK_API_KEY / DM_PASSWORD 等
#
# 数据库角色分工（重要）：
#   - 系统库：达梦 DM8（Compose 服务 dm8:5236；也可通过环境变量连接外部实例）
#     schema=SMART_QUERY 由 DataSeeder 兜底建表 + smart_query_seed.sql 导入种子
#   - 达梦 DM8：同时承载 SMART_QUERY 系统 Schema 与 SMART_QUERY_SAMPLE 演示业务 Schema

services:
  # 系统库 + 演示业务库：首次创建实例时强制大小写不敏感和 MySQL 兼容模式。
  dm8:
    image: dm8_single:dm8_20241022_rev244896_x86_rh6_64
    container_name: dm8
    privileged: true
    restart: unless-stopped
    environment:
      DM_SYSDBA_PASSWORD: ${DM_PASSWORD:-Dameng123}
      TZ: Asia/Shanghai
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports: ["${DM_HOST_PORT:-5236}:5236"]
    volumes:
      - dm8_data:/opt/dmdbms/data
      - ./docker/dm8-entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "LD_LIBRARY_PATH=/opt/dmdbms/bin /opt/dmdbms/bin/disql SYSDBA/$$DM_SYSDBA_PASSWORD@localhost:5236 -e 'SELECT 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  backend:
    image: smart-query-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: ["${BACKEND_HOST_PORT:-9001}:9000"]
    environment:
      # 系统库（达梦 DM8）：默认连接 Compose 内的 dm8 服务，也可由环境变量覆盖
      # DM8 已开 COMPATIBLE_MODE=4 + CASE_SENSITIVE=0，schema=SMART_QUERY
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:dm://${DM_HOST:-dm8}:${DM_PORT:-5236}}
      SPRING_DATASOURCE_USERNAME: ${DM_USERNAME:-SYSDBA}
      SPRING_DATASOURCE_PASSWORD: ${DM_PASSWORD:-Dameng123}
      SPRING_DATASOURCE_DRIVER: dm.jdbc.driver.DmDriver
      SPRING_DATASOURCE_INIT_SQL: ${DM_SCHEMA:-SET SCHEMA SMART_QUERY}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GLM_API_KEY: ${GLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SMART_QUERY_LLM_DEFAULT_MODEL: ${SMART_QUERY_LLM_DEFAULT_MODEL:-deepseek}
      JWT_SECRET: ${JWT_SECRET:-smart-query-default-jwt-secret-key-change-me-in-production-min-32-bytes}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Python 执行走独立镜像（后端通过 docker socket 以 docker run 调用）
      SMART_QUERY_PYTHON_EXECUTION_MODE: docker
      SMART_QUERY_PYTHON_DOCKER_IMAGE: smart-query-python:latest
      SMART_QUERY_PYTHON_DOCKER_SHARED_VOLUME: sq_artifacts
      SMART_QUERY_PYTHON_DOCKER_WORKSPACE_VOLUME: sq_workspace
      SMART_QUERY_PYTHON_DOCKER_NETWORK: smartquery-net
      SMART_QUERY_PYTHON_COMMAND: python3
      # 挖掘模型保存目录指到共享卷 sq_workspace（DooD 下临时 python 容器才持久化，predict 才能加载）
      SMART_QUERY_MINING_WORKSPACE: /tmp/smartquery-workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # DooD：后端 docker run python 镜像
      - sq_artifacts:/tmp/smartquery-artifacts       # 后端 ↔ python 容器共享产物/脚本
      - sq_workspace:/tmp/smartquery-workspace
    depends_on:
      dm8: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    image: smart-query-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["${FRONTEND_HOST_PORT:-5174}:80"]
    depends_on: [backend]

  # Python 执行镜像：仅构建、非常驻（后端 docker run 调用）。用 --profile 隔离，up 不启动它
  python:
    build: { context: ./docker/python, dockerfile: Dockerfile }
    image: smart-query-python:latest
    profiles: ["tools"]
    command: ["python3", "-c", "print('smart-query-python image ready')"]

volumes:
  dm8_data: {}
  # 显式 name：去掉 compose 项目前缀，使后端 `docker run -v <卷名>` 能精确挂到这两个共享卷
  sq_artifacts:
    name: sq_artifacts
  sq_workspace:
    name: sq_workspace

# 显式网络名：后端 `docker run --network smartquery-net` 调起的 python 容器加入此网络，才能解析 dm8 等服务名
networks:
  default:
    name: smartquery-net
