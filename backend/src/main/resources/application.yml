server:
  port: 9000
  servlet:
    context-path: /

spring:
  application:
    name: smart-query

  # 主数据源 (系统库) — 默认达梦 DM8（信创/私有化部署），可通过环境变量切回 MySQL
  # DM8 已开 COMPATIBLE_MODE=4（MySQL 兼容）+ CASE_SENSITIVE=0，MyBatis-Plus 语法兼容
  # schema 通过 SYSDBA 登录后 SET SCHEMA 切换（避免应用账号绑定 schema 的权限管理成本）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:dm://${DM_HOST:host.docker.internal}:${DM_PORT:5236}}
    username: ${SPRING_DATASOURCE_USERNAME:SYSDBA}
    password: ${SPRING_DATASOURCE_PASSWORD:Dameng123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:dm.jdbc.driver.DmDriver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # DM 用 SYSDBA 连接后切到 SMART_QUERY schema；MySQL 模式下此 SQL 自动忽略（注释安全）
      connection-init-sql: ${SPRING_DATASOURCE_INIT_SQL:SET SCHEMA SMART_QUERY}

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==================== 智能问数配置 ====================

smart-query:
  # 鉴权（JWT + BCrypt）
  jwt:
    secret: ${JWT_SECRET:smart-query-default-jwt-secret-key-change-me-in-production-min-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: smart-query
  auth:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-display-name: 系统管理员
  # LLM 配置
  llm:
    default-model: glm-5.1
    models:
      glm-5.1:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:9c82f455ae15490ca9372df1a707fbdb.4oDb1blqKcUWMVXr}
        max-tokens: 8192
        temperature: 0.1
      glm-4.5:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:9c82f455ae15490ca9372df1a707fbdb.4oDb1blqKcUWMVXr}
        max-tokens: 4096
        temperature: 0.1
      glm-4:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:9c82f455ae15490ca9372df1a707fbdb.4oDb1blqKcUWMVXr}
        max-tokens: 4096
        temperature: 0.1
      gpt-4o:
        api-url: https://api.openai.com/v1/chat/completions
        api-key: ${OPENAI_API_KEY:}
        max-tokens: 4096
        temperature: 0.1
      deepseek:
        api-url: https://api.deepseek.com/v1/chat/completions
        api-key: ${DEEPSEEK_API_KEY:}
        max-tokens: 4096
        temperature: 0.1
      ollama:
        api-url: http://localhost:11434/api/chat
        model-name: qwen2.5:7b
        max-tokens: 4096
        temperature: 0.1
    retry:
      max-attempts: 3
      backoff-multiplier: 2
      initial-delay-ms: 1000
    timeout-seconds: 120
    http-timeout-seconds: 180
    connect-timeout-seconds: 30
    max-retries: 10
    retry-delay-ms: 2000
    max-retry-delay-ms: 10000
    default-api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    default-max-tokens: 4096

  # Session
  session-timeout-minutes: 30

  # SSE
  sse:
    timeout-ms: 300000

  # Rate limiting
  rate-limit:
    chat-per-minute: 30

  # ReAct 引擎
  react:
    max-turns: 0
    max-tokens-per-turn: 8000
    auto-compact-threshold: 80000
    micro-compact-threshold: 60000
    max-token-budget: 200000

  # 上下文压缩器
  compactor:
    default-keep-recent-turns: 4
    micro-compact-keep-turns: 5
    max-summary-length: 3000

  # 提示词配置
  prompt:
    system-token-budget: 16000

  # Schema 探索
  schema:
    explore-sample-rows: 5

  # 数据挖掘调度
  mining:
    schedule:
      poll-interval-ms: 60000
    train-poll-interval-ms: 2000
    status-stream-timeout-ms: 120000
    python-timeout-ms: 300000
    predict-timeout-ms: 120000
    overfitting-gap-threshold: 0.15
    min-training-rows: 20

  # 动态数据源连接池
  datasource:
    dynamic:
      max-pool-size: 5
      min-idle: 1
      connection-timeout-ms: 10000
      idle-timeout-ms: 300000
      max-lifetime-ms: 600000

  # Python 执行环境
  python:
    execution-mode: process
    command: python3
    docker-image: smart-query-python:latest
    default-timeout-ms: 60000
    max-timeout-ms: 600000
    max-output-bytes: 65536
    max-memory-mb: 512
    max-cpus: 1
    stream-drain-timeout-seconds: 5
    artifact-dir: /tmp/smartquery-artifacts
    workspace-base: /tmp/smartquery-workspace
    # 熔断器配置
    circuit-breaker:
      failure-threshold: 10
      recovery-timeout-ms: 30000

  # ECharts 服务端渲染 (SSR) — 用于 Word 报告图表图片生成
  # 通过 Node 进程用 ECharts SSR SVG 模式渲染真实图表，无浏览器、无截图
  echarts:
    enabled: true
    node-command: node
    script-path: tools/echarts-ssr/render.mjs
    timeout-ms: 30000
    default-width: 800
    default-height: 600

  # SQL 安全
  sql-safety:
    level: normal
    allowed-statements: SELECT,SHOW,DESCRIBE,EXPLAIN
    denied-keywords: DROP,DELETE,UPDATE,INSERT,ALTER,CREATE,TRUNCATE,GRANT,REVOKE
    max-rows: 1000
    query-timeout-seconds: 30

  # 查询和历史管理
  query:
    metadata-max-chars: 262144
    history-token-budget: 20000
    history-keep-recent: 10
    metadata-max-display-rows: 50
    metadata-max-section-length: 2000
    metadata-max-python-stdout: 3000
    history-trim-chars: 100

  # 对话摘要
  summary:
    enabled: true
    max-tokens: 2000
    cache-ttl-minutes: 30

  # 日志
  logging:
    structured: true
    trace-all-requests: true
    ring-buffer-size: 100

  # 线程池
  thread-pool:
    core-size: 4
    max-size: 8
    queue-capacity: 100

  # 任务协调器
  coordinator:
    enabled: true
    parallel-execution: true
    max-concurrent-tasks: 5
    task-timeout-seconds: 300
    enable-task-retry: true
    max-retry-attempts: 2
    retry-delay-ms: 1000

  # 图表和报告
  chart:
    image-timeout-seconds: 30
    image-width: 800
    image-height: 600
    storage-path: ./charts  # 图表图片存储路径
    use-phantomjs: false
  report:
    enable-llm-summary: true
    fallback-to-simple: true
    max-appendix-messages: 20

logging:
  level:
    com.smartquery: DEBUG
    com.smartquery.logging: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-query.log
    max-size: 100MB
    max-history: 30
