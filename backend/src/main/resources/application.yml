server:
  port: 9000
  servlet:
    context-path: /

spring:
  application:
    name: smart-query

  # 主数据源 (系统库) — 默认达梦 DM8（信创/私有化部署），可通过环境变量切回 MySQL
  # DM8 已开 COMPATIBLE_MODE=4（MySQL 兼容）+ CASE_SENSITIVE=0，MyBatis-Plus 语法兼容
  # schema 通过 SYSDBA 登录后 SET SCHEMA 切换（避免应用账号绑定 schema 的权限管理成本）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:dm://${DM_HOST:host.docker.internal}:${DM_PORT:5236}}
    username: ${SPRING_DATASOURCE_USERNAME:SYSDBA}
    password: ${SPRING_DATASOURCE_PASSWORD:Dameng123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:dm.jdbc.driver.DmDriver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # DM 用 SYSDBA 连接后切到 SMART_QUERY schema；MySQL 模式下此 SQL 自动忽略（注释安全）
      connection-init-sql: ${SPRING_DATASOURCE_INIT_SQL:SET SCHEMA SMART_QUERY}

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==================== 智能问数配置 ====================

smart-query:
  # 鉴权（JWT + BCrypt）
  jwt:
    secret: ${JWT_SECRET:smart-query-default-jwt-secret-key-change-me-in-production-min-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: smart-query
  auth:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-display-name: 系统管理员
  # LLM 配置
  llm:
    default-model: glm-5.1
    models:
      glm-5.1:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:}
        max-tokens: 8192
        temperature: 0.1
      glm-4.5:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:}
        max-tokens: 4096
        temperature: 0.1
      glm-4:
        api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
        api-key: ${GLM_API_KEY:}
        max-tokens: 4096
        temperature: 0.1
      gpt-4o:
        api-url: https://api.openai.com/v1/chat/completions
        api-key: ${OPENAI_API_KEY:}
        max-tokens: 4096
        temperature: 0.1
      deepseek:
        api-url: https://api.deepseek.com/v1/chat/completions
        api-key: ${DEEPSEEK_API_KEY:}
        model-name: deepseek-chat
        max-tokens: 4096
        temperature: 0.1
      ollama:
        api-url: http://localhost:11434/api/chat
        model-name: qwen2.5:7b
        max-tokens: 4096
        temperature: 0.1
    # LLM HTTP 客户端重试（限流 429 / 5xx / 网络错误时生效）
    max-retries: 10
    retry-delay-ms: 2000
    max-retry-delay-ms: 10000
    # LLM 默认配置兜底（DB 中无对应 model 配置时使用）
    default-api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    default-max-tokens: 4096
    # 单次 LLM 调用超时（ReAct 引擎内 CompletableFuture.get 用）
    timeout-seconds: 120
    # HTTP 客户端超时
    http-timeout-seconds: 180
    connect-timeout-seconds: 30

  # Session
  session-timeout-minutes: 30

  # SSE
  sse:
    timeout-ms: 300000
    heartbeat-ms: 15000
    event-scan-ms: 1000
    event-retention-cron: "0 30 3 * * *"

  # 限流（ChatController 每用户每分钟提问数；RateLimiter 内部窗口/清理周期）
  rate-limit:
    chat-per-minute: 30
    window-ms: 60000
    cleanup-interval-ms: 120000
    bucket-expiry-ms: 120000

  # ReAct 引擎
  react:
    # 0 表示不限轮次（由 max-token-budget 兜底）；正数表示最多 N 轮
    max-turns: 0
    max-token-budget: 200000
    # 硬上限轮次：无论 previousToolsFailed/token 计数是否准确，达到此值必终止。
    # 防御 LLM 返回 token=0（某些代理端点）+ 工具持续失败时的死循环。
    hard-cap-turns: 50
    # 触发上下文精简的两个阈值（token 数）
    compact-threshold: 80000
    micro-compact-threshold: 60000
    # ReAct 层 LLM 调用重试上限（超时/可恢复错误时重试几次）
    llm-max-attempts: 2

  # 上下文压缩器
  compactor:
    default-keep-recent-turns: 4
    micro-compact-keep-turns: 5
    max-summary-length: 3000
    assistant-content-threshold: 1500
    assistant-max-lines: 30
    llm-summary-input-limit: 6000
    extract-content-limit: 8000
    tool-result-stub-threshold: 200
    stub-prefix-length: 100
    stub-summary-length: 80
    extract-user-content-length: 300
    extract-tool-content-length: 200
    truncation-user-length: 150
    truncation-tool-length: 100

  # 提示词配置
  prompt:
    system-token-budget: 16000
    cache-ttl-ms: 300000

  # Schema 探索
  schema:
    explore-sample-rows: 5

  # Schema / Ontology 上下文构建（缓存与截断）
  schema-context:
    sample-values-truncation: 200
    cache-ttl-ms: 300000
  ontology-context:
    cache-ttl-ms: 600000
    token-budget: 4000

  # 数据挖掘调度与训练
  mining:
    schedule:
      poll-interval-ms: 60000
    train-poll-interval-ms: 2000
    status-stream-timeout-ms: ${MINING_STATUS_STREAM_TIMEOUT_MS:600000}
    drift-monitor-interval-ms: ${MINING_DRIFT_MONITOR_INTERVAL_MS:21600000}
    python-timeout-ms: 300000
    predict-timeout-ms: 120000
    overfitting-gap-threshold: 0.15
    min-training-rows: 20
    # mining 工具（mining_model 工具）执行超时；compare/tune/history 上限
    tool-timeout-ms: 300000
    compare:
      max-algorithms: 5
    tune:
      max-combinations: 12
    history-limit: 20
    workspace: ${user.home}/smartquery-models
    random-state: 42
    max-concurrent-training: 4
    queue-timeout-minutes: 5
    rate-train: 5
    rate-predict: 20
    # 数据挖掘专用线程池（与 LLM / Web 线程池分离）
    thread-pool:
      core-size: 2
      max-size: 4
      queue-capacity: 20

  # V2 DAG 编排：数据库租约是跨实例唯一执行权
  orchestration:
    instance-id: ${ORCHESTRATION_INSTANCE_ID:}
    lease:
      duration-seconds: ${ORCHESTRATION_LEASE_SECONDS:30}
      heartbeat-interval-ms: 5000
      scan-interval-ms: 5000
      recovery-batch-size: 50
    node:
      default-timeout-seconds: 300
      replay-snapshot-max-bytes: 16777216
      replay-detail-record-limit: 20
    output-query:
      cursor-secret: ${OUTPUT_QUERY_CURSOR_SECRET:${JWT_SECRET:smart-query-default-jwt-secret-key-change-me-in-production-min-32-bytes}}
      cursor-max-age-seconds: 86400
      max-filters: 10
      max-in-values: 50
      max-value-length: 1000
      max-indexed-fields-per-row: 300
    storage:
      scan-interval-ms: ${STORAGE_RETENTION_SCAN_INTERVAL_MS:3600000}
      retention-batch-size: ${STORAGE_RETENTION_BATCH_SIZE:25}
      max-restore-bytes: ${STORAGE_MAX_RESTORE_BYTES:536870912}
    output-preview:
      max-records: 100
      max-input-bytes: 524288
    policy-preview:
      max-sql-rows: 50
      max-agent-records: 10
      max-input-bytes: 524288
    agent:
      llm-timeout-seconds: 60
    thread-pool:
      run-core-size: 2
      run-max-size: 4
      node-core-size: 4
      node-max-size: 8
      queue-capacity: 50

  # Pipeline 流程编排
  pipeline:
    execution-timeout-ms: 600000
    preview-timeout-ms: 120000
    default-cv-folds: 5
    default-test-size: 0.2
    default-bins: 5
    sample-rows: 10
    error-truncation: 5000
    log-truncation: 4000
    event-error-truncation: 300
    execution-log-truncation: 50000
    preview-error-truncation: 2000

  # 动态数据源连接池
  datasource:
    dynamic:
      max-pool-size: 5
      min-idle: 1
      connection-timeout-ms: 10000
      idle-timeout-ms: 300000
      max-lifetime-ms: 600000

  # Python 执行环境
  python:
    execution-mode: process
    command: python3
    docker-image: smart-query-python:latest
    default-timeout-ms: 60000
    max-timeout-ms: 600000
    max-output-bytes: 65536
    max-memory-mb: 512
    max-cpus: 1
    stream-drain-timeout-seconds: 5
    artifact-dir: /tmp/smartquery-artifacts
    workspace-base: /tmp/smartquery-workspace
    # docker 模式专属（execution-mode=docker 时生效）
    docker-network: smart-query-net
    docker-shared-volume: smartquery-shared
    docker-workspace-volume: smartquery-workspace
    # 内存监控周期（docker 模式下定期采样容器 RSS）
    mem-monitor-initial-delay-seconds: 2
    mem-monitor-period-seconds: 5
    # 进度上报间隔（长任务每 N 毫秒推送一次 stdout 进度）
    progress-report-interval: 1000
    # 熔断器配置
    circuit-breaker:
      failure-threshold: 5
      recovery-timeout-ms: 60000

  # ECharts 服务端渲染 (SSR) — 用于 Word 报告图表图片生成
  # 通过 Node 进程用 ECharts SSR SVG 模式渲染真实图表，无浏览器、无截图
  echarts:
    enabled: true
    node-command: node
    script-path: tools/echarts-ssr/render.mjs
    timeout-ms: 30000
    default-width: 800
    default-height: 600

  # SQL 安全（关键字列表硬编码在 SqlSafetyValidator，此处仅保留注释；如需外置可改 Bean）
  sql-safety:
    level: normal
    allowed-statements: SELECT,SHOW,DESCRIBE,EXPLAIN
    denied-keywords: DROP,DELETE,UPDATE,INSERT,ALTER,CREATE,TRUNCATE,GRANT,REVOKE
    max-rows: 1000
    query-timeout-seconds: 30

  # 查询和历史管理
  query:
    metadata-max-chars: 262144
    history-token-budget: 20000
    history-keep-recent: 10
    metadata-max-display-rows: 50
    metadata-max-section-length: 2000
    metadata-max-python-stdout: 3000
    history-trim-chars: 100

  # 事件日志截断
  event-log:
    truncation-short: 500
    truncation-medium: 1000
    truncation-long: 2000
    user-message-max: 1000

  # 自动标题
  auto-title:
    max-length: 20

  # 图表和报告
  chart:
    image-timeout-seconds: 30
    image-width: 800
    image-height: 600
    storage-path: ./charts

  # 线程池（Web/MVC 异步 + LLM 调用专用）
  thread-pool:
    core-size: 4
    max-size: 8
    queue-capacity: 100
    llm:
      core-size: 8
      max-size: 16
      queue-capacity: 100

  # 外部不可变运行时构建器。密钥为空时 worker API 保持关闭；生产环境必须由密钥管理系统注入。
  runtime-builder:
    hmac-secret: ${RUNTIME_BUILDER_HMAC_SECRET:}
    signature-max-skew-seconds: 300
    lease-seconds: 1800
    max-attempts: 3

logging:
  level:
    com.smartquery: DEBUG
    com.smartquery.logging: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/smart-query.log
    max-size: 100MB
    max-history: 30
